# One command runs everything:  docker compose up --build
# Console: http://localhost:3000   API: http://localhost:8080   Postgres: localhost:5433
services:
  postgres:
    image: postgres:16
    container_name: stockpulse-db
    environment:
      POSTGRES_DB: stockpulse
      POSTGRES_USER: stockpulse
      POSTGRES_PASSWORD: stockpulse
    ports:
      - "5433:5432"
    volumes:
      - stockpulse-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stockpulse"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    container_name: stockpulse-backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/stockpulse
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-gemini-3.5-flash-lite}
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/8080' || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 30

  frontend:
    build: ./frontend
    container_name: stockpulse-frontend
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "3000:80"

volumes:
  stockpulse-data:
