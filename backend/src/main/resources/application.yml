spring:
  application:
    name: stockpulse
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/stockpulse}
    username: ${DB_USER:stockpulse}
    password: ${DB_PASSWORD:stockpulse}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  http:
    client:
      connect-timeout: 3s
      read-timeout: 15s

server:
  port: 8080

llm:
  provider: ${LLM_PROVIDER:gemini}
  base-url: ${LLM_BASE_URL:https://generativelanguage.googleapis.com}
  model: ${LLM_MODEL:gemini-3.5-flash-lite}
  api-key: ${GEMINI_API_KEY:}
  temperature: 0.3

stockpulse:
  strategy:
    pricing: ai
    reorder: ruleBased
  spike:
    multiplier: 2.0
  reorder:
    lead-time-days: 7
  cors:
    allowed-origins: http://localhost:5173

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    com.stockpulse: INFO
